name: Ours
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  Ours:
    type: application
    platform: iOS
    sources:
      - path: Ours
    info:
      path: Ours/Info.plist
      properties:
        CFBundleDisplayName: Ours
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # 占位 Bundle ID：PRD 待定项，上架前定
        PRODUCT_BUNDLE_IDENTIFIER: com.ours.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        CODE_SIGN_STYLE: Automatic
        # 动态框架运行时搜索路径（OneSignal 是动态库）
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    dependencies:
      - package: supabase
        product: Supabase
      # OneSignal 5.8.0 预编译 XCFramework（Vendor/OneSignal，由 scripts/fetch-onesignal.sh 拉取）
      # 不用 SwiftPM 源码包：那个仓库 3GB，大陆网络克隆会反复超时
      - framework: Vendor/OneSignal/OneSignalCore.xcframework
        embed: true
      - framework: Vendor/OneSignal/OneSignalOSCore.xcframework
        embed: true
      - framework: Vendor/OneSignal/OneSignalNotifications.xcframework
        embed: true
      - framework: Vendor/OneSignal/OneSignalExtension.xcframework
        embed: true
      - framework: Vendor/OneSignal/OneSignalOutcomes.xcframework
        embed: true
      - framework: Vendor/OneSignal/OneSignalUser.xcframework
        embed: true
      - framework: Vendor/OneSignal/OneSignalLiveActivities.xcframework
        embed: true
      - framework: Vendor/OneSignal/OneSignalFramework.xcframework
        embed: true

  # UI 测试（XCUITest）：能真正点按模拟器，补上 simctl 装包/截图之外的空缺
  # 跑法（本机 xcode-select 指向 CommandLineTools，必须带 DEVELOPER_DIR）：
  #   DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcodebuild test \
  #     -project Ours.xcodeproj -scheme Ours \
  #     -destination 'platform=iOS Simulator,name=iPhone Duo'
  OursUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OursUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ours.app.uitests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # 被测 App 的 target 名（XCUITest 靠它找到宿主 App）
        TEST_TARGET_NAME: Ours
    dependencies:
      - target: Ours

schemes:
  Ours:
    build:
      targets:
        Ours: all
        OursUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - OursUITests
